<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Visor de Fichas INS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
/* Layout: carga + resumen arriba · pestañas · formulario vivo a la izquierda, inspector fijo a la derecha (se apila en móvil). Grilla de 12 columnas = anchos de Signframe. */
:root{
  --bg:#f3f5f6; --panel:#ffffff; --panel-2:#eef2f3; --ink:#15212a; --muted:#5b6b75; --line:#d6dee2; --field:#ffffff;
  --accent:#0d6b73; --accent-soft:#d9eeef; --accent-ink:#ffffff;
  --warn:#9a5b00; --warn-soft:#fbeed6; --bad:#a3262d; --bad-soft:#f9e1e2; --ok:#2d6a3a; --ok-soft:#e0f0e3;
  --json:#6a3fa0; --json-soft:#ece4f6;
  --f-display:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1519; --panel:#161f25; --panel-2:#1c272e; --ink:#e3eaee; --muted:#93a4ae; --line:#2b3a43; --field:#10181d;
  --accent:#4fb8bf; --accent-soft:#16363a; --accent-ink:#06191b;
  --warn:#f0b35a; --warn-soft:#3a2a10; --bad:#f08a90; --bad-soft:#3d1a1d; --ok:#8fd19c; --ok-soft:#173222;
  --json:#c3a3ec; --json-soft:#2b2140; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1519; --panel:#161f25; --panel-2:#1c272e; --ink:#e3eaee; --muted:#93a4ae; --line:#2b3a43; --field:#10181d;
  --accent:#4fb8bf; --accent-soft:#16363a; --accent-ink:#06191b;
  --warn:#f0b35a; --warn-soft:#3a2a10; --bad:#f08a90; --bad-soft:#3d1a1d; --ok:#8fd19c; --ok-soft:#173222;
  --json:#c3a3ec; --json-soft:#2b2140; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:14px 40px}
.wrap{max-width:1440px;margin:0 auto;display:grid;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:22px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--f-mono);font-size:.92em}

/* Vuelta al hub de Form Tools. Es lo unico que se agrego al archivo suelto. */
.ft-nav{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:2px}
.ft-nav a{color:var(--muted);text-decoration:none;font-size:12.5px;border-bottom:1px solid transparent}
.ft-nav a:hover{color:var(--accent);border-bottom-color:var(--accent)}

.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.top .who{display:grid;gap:2px;min-width:0}
.top .file{font-family:var(--f-mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.load{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:7px 12px;color:var(--muted)}
.drop.over{border-color:var(--accent);color:var(--accent)}
.err{background:var(--bad-soft);color:var(--bad);border-radius:var(--r);padding:8px 12px}
.info{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:8px 12px}

.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px 12px;display:flex;gap:8px;align-items:baseline}
.stat b{font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:9px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:11px;margin-left:6px;color:var(--muted)}

.work{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
@media (max-width:1000px){.work{grid-template-columns:minmax(0,1fr)}}
.tools{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.tools label{display:flex;gap:6px;align-items:center;cursor:pointer}
.tools input[type=search]{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:6px 10px;min-width:0;width:220px;max-width:100%}

.paso{display:grid;gap:12px;margin-bottom:22px}
.paso-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.paso-h .k{font-family:var(--f-mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.paso-h h2{font-size:18px}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.sec.off{opacity:.55}
.sec-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.sec-h h3{font-size:15px}
.sec-h .meta{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px 16px;padding:14px;align-items:start}
.f{grid-column:span 6;border:1px solid transparent;border-radius:var(--r);padding:6px 8px;margin:-6px -8px;min-width:0;position:relative}
.f:hover{background:var(--panel-2)}
.f.sel{border-color:var(--accent);background:var(--accent-soft)}
.f.ghost{opacity:.6;border:1px dashed var(--line)}
.f.appear{animation:appear .35s ease-out}
@keyframes appear{from{background:var(--accent-soft)}to{background:transparent}}
.f.w-full{grid-column:span 12}.f.w-three-quarters{grid-column:span 9}.f.w-two-thirds{grid-column:span 8}
.f.w-half{grid-column:span 6}.f.w-third{grid-column:span 4}.f.w-quarter{grid-column:span 3}.f.w-fit{grid-column:span 3}
@media (max-width:640px){.grid .f{grid-column:span 12}}
.f .lab{font-weight:500;font-size:13px;display:block;overflow-wrap:anywhere;padding-right:34px;cursor:pointer}
.f .req{color:var(--bad);margin-left:2px}
.f .ctl{margin-top:6px}
.wtag{position:absolute;top:5px;right:7px;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.in{width:100%;border:1px solid var(--line);background:var(--field);border-radius:5px;height:34px;padding:0 10px;min-width:0}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.in[readonly],.in:disabled{background:var(--panel-2);color:var(--muted)}
textarea.in{height:64px;padding:7px 10px;resize:vertical}
.rg{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13.5px;min-height:34px;align-items:center}
.rg.v{flex-direction:column;align-items:flex-start}
.rg label{display:flex;gap:6px;align-items:center;cursor:pointer}
.rg input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.yn{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.yn button{border:0;background:var(--field);padding:6px 16px}
.yn button+button{border-left:1px solid var(--line)}
.yn button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px;margin-top:2px}
.pair{display:flex;gap:6px}.pair>*{flex:1;min-width:0}
.legend{grid-column:span 12;font-family:var(--f-display);font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.b{font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:1px 6px;border-radius:3px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.b.json{background:var(--json-soft);color:var(--json)}
.b.warn{background:var(--warn-soft);color:var(--warn)}
.b.ok{background:var(--ok-soft);color:var(--ok)}
.b.acc{background:var(--accent-soft);color:var(--accent)}
.cond{margin-top:6px;font-size:12px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.cond .how{color:var(--muted)}
.cond .st{font-size:10.5px;font-weight:700;padding:0 5px;border-radius:3px}
.cond .st.prop{background:var(--warn-soft);color:var(--warn)}
.cond .st.conf{background:var(--ok-soft);color:var(--ok)}
.rule{margin-top:5px;font-size:12px;color:var(--warn)}

.jsonbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 0;overflow-x:auto;font-family:var(--f-mono);font-size:12.5px;line-height:1.7}
.jl{white-space:pre;padding:0 14px;display:flex;gap:18px;min-width:max-content}
.jl.leaf{cursor:pointer}
.jl.leaf:hover{background:var(--panel-2)}
.jl.sel{background:var(--accent-soft)}
.jl.empty .jv{color:var(--muted)}
.jl.off{opacity:.45;text-decoration:line-through}
.jk{color:var(--accent)}
.jc{color:var(--muted);font-family:var(--f-body);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--panel);padding:6px 11px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.list{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-display);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--panel-2);position:sticky;top:0}
td.mono{font-family:var(--f-mono);font-size:11.5px;overflow-wrap:anywhere}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel-2)}
tr.sel td{background:var(--accent-soft)}

.insp{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:14px;max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:1000px){.insp{position:static;max-height:none}}
.insp h3{font-size:16px}
.insp .empty{color:var(--muted)}
.blk{display:grid;gap:6px}
.blk>.t{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:4px 10px;font-size:12.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;overflow-wrap:anywhere}
.kv dd.mono{font-family:var(--f-mono);font-size:11.5px}
.insp>*{min-width:0}
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.chips.types{grid-template-columns:repeat(3,minmax(0,1fr))}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:4px;padding:5px 2px;font-size:11.5px;min-width:0;overflow-wrap:anywhere}
.insp .btn{max-width:100%;text-align:left;overflow-wrap:anywhere}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.src{font-size:12px;color:var(--muted)}
.bulk{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px;margin-bottom:12px;font-size:13px}
.bulk .t{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.opaso{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}
.oph{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.oph .k{font-family:var(--f-mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.08em}
.oname{border:1px solid transparent;background:transparent;border-radius:4px;padding:3px 6px;font-family:var(--f-display);font-size:17px;font-weight:700;min-width:0;flex:1}
.oname.sm{font-family:var(--f-body);font-size:14px;font-weight:600;flex:1 1 180px}
.oname:hover,.oname:focus{border-color:var(--line);background:var(--field)}
.osec{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line)}
.osec:last-child{border-bottom:0}
.osec.sis{background:var(--panel-2)}
.oact{display:flex;gap:4px;align-items:center;margin-left:auto}
.oact select{border:1px solid var(--line);background:var(--field);border-radius:4px;padding:4px 6px;font-size:12.5px;max-width:220px}
.ob{border:1px solid var(--line);background:var(--bg);border-radius:4px;width:28px;height:28px;padding:0}
.ob:disabled{opacity:.35;cursor:default}
.osec.add{background:transparent}
.mchk{position:absolute;top:6px;left:-2px;width:16px;height:16px;accent-color:var(--accent);z-index:1}
.f .mchk+.wtag+.lab{padding-left:18px}
.f.msel{background:var(--accent-soft);border-color:var(--accent)}
.mbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px);z-index:5;box-shadow:0 4px 14px color-mix(in srgb,var(--ink) 12%,transparent)}
.mbar button:disabled{opacity:.45;cursor:default}
.pdfwrap{display:grid;gap:4px;margin-bottom:14px}
.pdfpage{position:relative;width:100%;border:1px solid var(--line);background:#fff;overflow:hidden}
.pdfcv{position:absolute;inset:0;width:100%;height:100%;display:block}
.wbox{position:absolute;padding:0;border:1.5px solid var(--muted);background:color-mix(in srgb,var(--muted) 12%,transparent);border-radius:2px;cursor:pointer}
.wbox span{position:absolute;left:-1px;top:-13px;font:600 9px/1 var(--f-mono);background:var(--muted);color:var(--bg);padding:1px 3px;border-radius:2px}
.wbox.st-prop{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 22%,transparent)}.wbox.st-prop span{background:var(--warn)}
.wbox.st-conf{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,transparent)}.wbox.st-conf span{background:var(--ok)}
.wbox.sel{outline:3px solid var(--accent);outline-offset:1px;z-index:2}
.wbox.armedw{box-shadow:0 0 0 3px var(--accent)}
.wbox.dropok{outline:3px dashed var(--accent)}
.split{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:760px){.split{grid-template-columns:minmax(0,1fr)}}
.tlist{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);max-height:calc(100vh - 20px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:6px}
.tsec{font:600 11px/1.3 var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--accent);padding:8px 6px 4px}
.trow{display:grid;gap:3px;padding:6px 8px;border-radius:4px;cursor:grab;font-size:12.5px;border:1px solid transparent}
.trow:hover{background:var(--panel-2)}
.trow.topt{padding-left:22px;color:var(--muted)}
.trow.has .tl::after{content:" ✓";color:var(--ok);font-weight:700}
.trow.dropok{outline:2px dashed var(--accent)}
.trow.armed{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.tc{display:flex;flex-wrap:wrap;gap:4px}
.wchip{display:inline-flex;align-items:center;gap:3px;font:500 10.5px/1.4 var(--f-mono);background:var(--ok-soft);color:var(--ok);border-radius:3px;padding:0 2px 0 5px}
.wchip.prop{background:var(--warn-soft);color:var(--warn)}
.wchip button{border:0;background:none;color:inherit;padding:0 3px;font-size:12px;cursor:pointer}
.where{display:grid;gap:3px;font-size:12.5px}
.raw summary{cursor:pointer;font-size:12.5px;color:var(--accent)}
.rawwrap{display:grid;gap:8px;margin-top:6px;overflow-x:auto}
.rawt{font-size:11.5px;border:1px solid var(--line);border-radius:4px;width:100%}
.rawt caption{text-align:left;font-weight:600;font-size:11.5px;color:var(--muted);padding:2px 0}
.rawt th{position:static;text-transform:none;letter-spacing:0;font-family:var(--f-body);font-size:11px;width:42%;background:var(--panel-2)}
.rawt th,.rawt td{padding:4px 6px}
.sec.inst{border-left:3px solid var(--accent)}
.inst-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.map-in{width:100%;min-width:0;border:1px solid var(--line);background:var(--field);border-radius:4px;padding:4px 7px;font-family:var(--f-mono);font-size:11.5px}
.map-in.prop{border-color:var(--warn);background:var(--warn-soft)}
.map-in.ok{border-color:var(--ok)}
tr.opt td:first-child{padding-left:26px;color:var(--muted)}
.save{font-size:12px;color:var(--muted);background:var(--panel-2);border-radius:4px;padding:6px 8px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.note{font-size:12px;color:var(--muted)}
.ce{display:grid;gap:6px;background:var(--panel-2);border-radius:5px;padding:8px}
.ce .row select{flex:1;min-width:0;max-width:100%;border:1px solid var(--line);background:var(--field);border-radius:4px;padding:4px 6px;font-size:12.5px}
.ce .x{border:0;background:none;color:var(--muted);font-size:15px;padding:0 4px}
pre.snip{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;font-family:var(--f-mono);font-size:10.8px;line-height:1.5;overflow-x:auto;white-space:pre}
textarea.out{width:100%;min-height:120px;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);padding:8px}
.rtext{font-size:12.5px;background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:6px 8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>


</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="who">
      <nav class="ft-nav">
        <a href="../index.html">← Form Tools</a>
        <a href="../index.html#v2-circuito">Ver el circuito 2.0 anterior</a>
      </nav>
      <h1>Visor de Fichas INS</h1>
      <div class="file" id="fileName">—</div>
    </div>
    <div class="load">
      <label class="btn primary" for="fileIn">Cargar ficha (.xlsx)</label>
      <input id="fileIn" type="file" accept=".xlsx,.xls" hidden>
      <div class="drop" id="drop">o soltala acá</div>
      <button class="btn" id="btnSample" type="button">Volver al ejemplo</button>
      <button class="btn primary" id="btnFormDef" type="button">Exportar form-def</button>
    </div>
  </header>
  <div id="error" class="err" hidden></div>
  <div class="stats" id="stats"></div>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-form" data-tab="form" aria-selected="true">Formulario</button>
    <button class="tab" role="tab" id="t-json" data-tab="json" aria-selected="false">JSON que sale</button>
    <button class="tab" role="tab" id="t-reglas" data-tab="reglas" aria-selected="false">Reglas</button>
    <button class="tab" role="tab" id="t-acro" data-tab="acro" aria-selected="false">AcroForms del PDF</button>
    <button class="tab" role="tab" id="t-pdf" data-tab="pdf" aria-selected="false">Main de Signframe</button>
    <button class="tab" role="tab" id="t-tabla" data-tab="tabla" aria-selected="false">Todo en una tabla</button>
  </nav>

  <div class="work">

<script>
(function(){
"use strict";
var WIDTHS=["full","three-quarters","two-thirds","half","third","quarter","fit"];
var WLABEL={"full":"full","three-quarters":"3/4","two-thirds":"2/3","half":"1/2","third":"1/3","quarter":"1/4","fit":"fit"};
var TYPES=[["text","Texto"],["textarea","Texto largo"],["number","Número"],["date","Fecha"],["select","Select"],["radio","Radio"],["boolean","Sí/No"],["checkbox","Casilla"],["numcombo","Número + unidad"]];
var TLABEL={};TYPES.forEach(function(t){TLABEL[t[0]]=t[1]});
var state={file:"",fields:[],byId:{},byRuta:{},legends:[],ejemplo:null,tab:"form",sel:null,showAll:false,q:"",jsonMode:"vivo",
  vals:{},inst:{},armed:null,split:false,msel:{},multi:false,mctrl:"",mval:"",mreq:false,ov:{w:{},t:{},c:{}},predet:{w:{},t:{},clases:{}},secHide:{},autoCond:{},lastVisible:{}};

function store(k,v){try{if(v===undefined){var r=localStorage.getItem(k);return r?JSON.parse(r):null}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){return String(s==null?"":s).replace(/\s+/g," ").trim()}
function low(s){return norm(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}
function leafOf(r){var p=String(r||"").split(".");return p[p.length-1]}
function shortRoute(r){return String(r||"").replace(/^datosFormulario\./,"")}
function slug(r){return shortRoute(r).replace(/\[\]/g,"").replace(/^personas\./,"").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"")}
function sfId(f){return "field_ficha_"+slug(f.ruta)}

/* ============ lectura de la ficha (por posición de columna) ============ */
var HEADERS={};
function parseSheets(sheets){
  var fields=[],byKey={},legends=[],ejemplo=null,order=0;
  sheets.forEach(function(sh){
    var name=norm(sh.name),rows=sh.rows||[];
    if(/json generado/i.test(name)){
      var txt=rows.map(function(r){return r&&r[0]!=null?String(r[0]):""}).join("\n");
      try{ejemplo=JSON.parse(txt)}catch(e){ejemplo=null}
      return;
    }
    if(/estructura base/i.test(name)) return;
    var head=(rows[0]||[]).filter(function(x){return x!=null&&x!==""}).length;
    if(head<10) return;
    HEADERS[name]=rows[0]||[];
    rows.slice(1).forEach(function(r,ri){
      if(!r) return;
      var c=[];for(var i=0;i<14;i++)c[i]=r[i]==null?"":r[i];
      if(!c.some(function(x){return norm(x)!==""})) return;
      var ruta=norm(c[12]);
      if(!ruta){
        var t=norm(c[2])||norm(c[3])||norm(c[1]);
        if(t&&norm(c[1])&&!/^no aplica/i.test(t)&&!/no posee campos/i.test(t)) legends.push({hoja:name,paso:norm(c[0]),seccion:norm(c[1]),texto:t,order:order++,fila:ri+2});
        return;
      }
      var key=name+"|"+ruta,f=byKey[key];
      if(!f){
        f=byKey[key]={id:"f"+fields.length,hoja:name,order:order++,
          paso:norm(c[0]),seccion:norm(c[1]),pdf:norm(c[2]),label:norm(c[3])||norm(c[2])||leafOf(ruta),
          tipo:norm(c[4]),valores:[],reglaRows:[],oblig:norm(c[7]),formI:norm(c[8]),visual:norm(c[9]),
          obs:norm(c[10]),ruta:ruta,sourceNames:[]};
        fields.push(f);
      }
      var v=c[5]===""?"":norm(c[5]);
      f.valores.push(v);
      f.reglaRows.push({valor:v,regla:norm(c[6])});
      (f.filas=f.filas||[]).push(ri+2);(f.rawRows=f.rawRows||[]).push(c);
      if(!f.obs&&norm(c[10]))f.obs=norm(c[10]);
      var sn=norm(c[13]);if(sn&&!/^no aplica$/i.test(sn)&&f.sourceNames.indexOf(sn)<0)f.sourceNames.push(sn);
    });
  });
  fields.forEach(classify);
  return {fields:fields,legends:legends,ejemplo:ejemplo};
}

function classify(f){
  var t=low(f.tipo),vis=low(f.visual),ob=low(f.oblig),pa=low(f.paso);
  f.soloJSON=ob==="json"||pa==="json"||low(f.seccion)==="json";
  f.oculto=/no aplica/.test(vis);
  f.readOnly=/disabled/.test(vis);
  f.prellenado=/prellenad/.test(vis);
  f.required=/both|si|sí|obligatori/.test(ob)&&!f.soloJSON;
  f.reglas=f.reglaRows.filter(function(x){return x.regla});
  f.excluido=f.reglas.some(function(g){return /no aplica formulario/i.test(g.regla)});
  var vals=f.valores.filter(function(v){return v!==""});
  f.catalogo=vals.some(function(v){return /ver cat[aá]logo/i.test(v)});
  var comboOpts=[],numLen=null,plain=[];
  vals.forEach(function(v){
    var m=/^opci[oó]n\s*\d+\s*del combo:\s*(.+)$/i.exec(v);
    if(m){comboOpts.push(norm(m[1]));return}
    var n=/campo num[eé]rico con\s*(\d+)/i.exec(v);if(n){numLen=+n[1];return}
    plain.push(v);
  });
  var len=null;
  f.reglas.map(function(x){return x.regla}).concat(vals).forEach(function(s){var m=/\((\d+)\)|(\d+)\s*caracteres/i.exec(s);if(m&&len==null)len=+(m[1]||m[2])});
  if(numLen)len=numLen;
  f.maxLength=len;
  var multi=f.valores.length>1,w;
  if(/check/.test(t)) w="checkbox";
  else if(/boolean/.test(t)) w="boolean";
  else if(/num[eé]rico y combo/.test(t)) w="numcombo";
  else if(/alfanum/.test(t)) w="text";
  else if(/radio/.test(t)) w="radio";
  else if(/combo/.test(t)) w="select";
  else if(/fecha/.test(t)) w="date";
  else if(/num[eé]ric|porcent/.test(t)) w="number";
  else w="text";
  if(w==="text"&&len&&len>=120) w="textarea";
  f.widget0=w;
  f.options=comboOpts.length?comboOpts:(multi||w==="radio"||w==="select")?plain.filter(function(v){return !/ver cat[aá]logo/i.test(v)}):[];
  if((w==="radio"||w==="select")&&f.options.length===1&&!multi){f.ejemploValor=f.options[0];f.options=[]}
  if(!multi&&plain.length===1&&w!=="radio"&&w!=="select")f.ejemploValor=plain[0];
  if(f.widget0==="numcombo"){f.unidades=f.options;f.options=[]}
  f.leaf=leafOf(f.ruta);
}

/* ============ traducción de la col G a condiciones (propuestas) ============ */
var STOP={};("solo esta estas este pregunta preguntas opcion opciones indico marco selecciono respondio anterior usuario visualiza "+
 "despliega debe desplegar seccion caso contrario presentar habilita habilitan combo campo para pintar todas adicionales continua "+
 "partir cual cuales donde desde sobre obligatorio sera seran alguna algun actual usted").split(" ").forEach(function(w){STOP[w]=1});
function words(s){return low(s).replace(/[^a-z0-9ñ ]/g," ").split(/\s+/).filter(function(w){return w.length>=4&&!STOP[w]})}
function stem(w){return w.slice(0,5)}
function overlap(labelWords,textWords){var st={};textWords.forEach(function(w){st[stem(w)]=1});return labelWords.filter(function(w){return st[stem(w)]}).length}
function isCtrl(f){var w=widgetOf(f);return w==="radio"||w==="select"||w==="boolean"||w==="checkbox"}
function optsOf(f){var w=widgetOf(f);if(w==="boolean"||((w==="radio"||w==="select")&&!f.options.length&&isSiNo(f)))return ["Sí","No"];if(w==="checkbox")return ["Marcado"];return f.options.length?f.options:(f.catalogo?["Opción de catálogo 1","Opción de catálogo 2","Opción de catálogo 3"]:[])}
function pickValues(ctrl,text){
  var t=low(text),m=/\bsi\b/.exec(t),after=m?t.slice(m.index+2):t;
  var found=[];
  optsOf(ctrl).forEach(function(o){var re=new RegExp("(^|[^a-z0-9])"+low(o).replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"([^a-z0-9]|$)");var mm=re.exec(after);if(mm)found.push({o:o,i:mm.index})});
  found.sort(function(a,b){return a.i-b.i});
  if(found.length>=2&&/opciones/.test(t)) return found.map(function(x){return x.o});
  if(found.length) return [found[0].o];
  var o=optsOf(ctrl);return [o.indexOf("Sí")>=0?"Sí":o[0]];
}
function buildAutoConds(fields){
  var auto={},secHide={};
  function add(dep,ctrl,vals,src,req){
    if(!dep||!ctrl||dep===ctrl) return;
    var c=auto[dep.ruta]||(auto[dep.ruta]={logic:"or",conditions:[],required:false,src:[]});
    vals.forEach(function(v){if(!c.conditions.some(function(x){return x.ruta===ctrl.ruta&&x.value===v}))c.conditions.push({ruta:ctrl.ruta,value:v})});
    if(req)c.required=true;
    if(c.src.indexOf(src)<0)c.src.push(src);
  }
  var bySheet={};fields.forEach(function(f){(bySheet[f.hoja]=bySheet[f.hoja]||[]).push(f)});
  // P0: sección que no se presenta
  fields.forEach(function(f){f.reglas.forEach(function(r){
    var t=low(r.regla);
    if(/no se debe(?: de)? presentar/.test(t)&&!/\bsi\b/.test(t)) secHide[f.hoja+"|"+f.seccion]=r.regla;
  })});
  // P1: "Solo se visualiza si…", "Se despliega solo si…", "Solo es obligatorio si…", "Solo se habilita(n)…"
  fields.forEach(function(f){
    var r=f.reglas.map(function(x){return x.regla}).filter(function(x){return /(solo se (visualiza|despliega|habilita)|se (visualiza|despliega) solo|solo es obligatorio)/i.test(x)})[0];
    if(!r) return;
    var list=bySheet[f.hoja],idx=list.indexOf(f),ctrls=[];
    if(/anterior/i.test(r)){
      for(var i=idx-1;i>=0;i--){var p=list[i];if(p.reglas.some(function(x){return x.regla===r}))continue;if(isCtrl(p)){ctrls=[p];break}}
    }else{
      var tw=words(r),best=0,cands=[];
      list.slice(0,idx).forEach(function(p){if(!isCtrl(p))return;var lw=words(p.label);if(!lw.length)return;var s=overlap(lw,tw);
        if(s===lw.length)cands.push(p);else if(s>best){best=s}});
      if(cands.length)ctrls=cands;
      else if(best>0){list.slice(0,idx).forEach(function(p){if(isCtrl(p)&&overlap(words(p.label),tw)===best)ctrls=[p]})}
    }
    ctrls.forEach(function(c){add(f,c,pickValues(c,r),"regla del campo",/obligatori/i.test(r))});
  });
  // P2 específico: "Despliega preguntas de A y B", "se debe pintar la opción para "X""
  fields.forEach(function(ctrl){
    ctrl.reglas.forEach(function(rr){
      var t=rr.regla,m,phrases=null;
      if(/no debe desplegar|contin[uú]a (con|a partir)/i.test(t)) return;
      if((m=/despliega preguntas de (.+)/i.exec(t))&&!/todas/i.test(t)) phrases=m[1].replace(/[.]$/,"").split(/\s+y\s+|,/);
      else if((m=/pintar la opci[oó]n para\s*["“]?([^"”]+)["”]?/i.exec(t))) phrases=[m[1]];
      if(!phrases) return;
      var list=bySheet[ctrl.hoja],idx=list.indexOf(ctrl),after=list.slice(idx+1,idx+12).filter(function(x){return x.seccion===ctrl.seccion||/pintar/i.test(t)});
      phrases.forEach(function(ph){
        var pw=words(ph),best=null,bs=0;
        after.forEach(function(d){var s=overlap(words(d.label),pw);if(s>bs){bs=s;best=d}});
        if(!best&&/pintar/i.test(t)) best=after.filter(function(d){return !isCtrl(d)})[0];
        if(best&&!(auto[best.ruta]&&auto[best.ruta].src.indexOf("regla del campo")>=0)) add(best,ctrl,[rr.valor||"Sí"],"regla de la opción «"+rr.valor+"»");
      });
    });
  });
  // P2 general: "Despliega todas las preguntas adicionales de X"
  fields.forEach(function(ctrl){
    ctrl.reglas.forEach(function(rr){
      if(!/despliega todas las preguntas/i.test(rr.regla)) return;
      bySheet[ctrl.hoja].forEach(function(d){if(d.order>ctrl.order&&d.seccion===ctrl.seccion&&!auto[d.ruta])add(d,ctrl,[rr.valor||"Sí"],"«"+rr.regla+"»")});
    });
  });
  // P3: "En caso afirmativo…" sin regla → pregunta Sí/No anterior
  Object.keys(bySheet).forEach(function(h){var list=bySheet[h];list.forEach(function(f,i){
    if(auto[f.ruta]||!/^en caso afirmativo/i.test(f.label)) return;
    for(var j=i-1;j>=0;j--){if(isCtrl(list[j])){add(f,list[j],["Sí"],"«En caso afirmativo» en la pregunta");break}}
  })});
  return {auto:auto,secHide:secHide};
}

/* ============ decisiones: manual > predeterminado > convención ============ */
var CONV=[
  {test:function(f){return /^(codigoTipoIdentificacion|numeroIdentificacion|identificacion)$/.test(f.leaf)},w:"half",txt:"tipo y número de identificación: 1/2 + 1/2"},
  {test:function(f){return /^(primerNombre|segundoNombre|primerApellido|segundoApellido)$/.test(f.leaf)},w:"quarter",txt:"los 4 nombres: 1/4 cada uno"},
  {test:function(f){return /^nombreCompleto/.test(f.leaf)},w:"full",txt:"nombre completo: full"},
  {test:function(f){return /^codigo(Provincia|Canton|Distrito)$/.test(f.leaf)},w:"third",txt:"provincia / cantón / distrito: 1/3"},
  {test:function(f){return widgetOf(f)==="date"},w:"fit",txt:"fechas: fit"},
  {test:function(f){return /^telefono/i.test(f.leaf)},w:"quarter",txt:"teléfonos: 1/4"},
  {test:function(f){return widgetOf(f)==="number"},w:"quarter",txt:"cantidades: 1/4"},
  {test:function(f){return widgetOf(f)==="checkbox"},w:"full",txt:"casillas con texto legal: full"},
  {test:function(f){return widgetOf(f)==="textarea"||(f.maxLength&&f.maxLength>=60)||f.label.length>70},w:"full",txt:"texto largo o pregunta larga: full"},
  {test:function(f){return widgetOf(f)==="numcombo"},w:"half",txt:"número + unidad: 1/2"}
];
function key(f){return f.custom?"manual|"+f.cid:f.hoja+"|"+f.ruta}
function refOf(f){return f.ruta||("@"+f.cid)}
function makeCustom(c,n){
  return {id:"cf_"+c.cid,cid:c.cid,custom:true,hoja:"(agregado)",order:1e6+n,paso:"",seccion:c.seccion||"",pdf:"",label:c.label||"Campo nuevo",tipo:"Agregado por vos",
    valores:[],reglaRows:[],reglas:[],oblig:c.required?"Both":"",formI:"",visual:"",obs:"",ruta:c.ruta||"",sourceNames:[],soloJSON:false,oculto:false,readOnly:false,
    prellenado:false,required:!!c.required,excluido:false,catalogo:false,maxLength:null,widget0:c.type||"text",options:(c.options||[]).slice(),leaf:leafOf(c.ruta||("campo_"+c.cid)),filas:[],rawRows:[]};
}
function rebuildFields(){
  var base=state.baseFields||[],cf=(state.ov.cf||[]).map(makeCustom);
  state.fields=base.concat(cf);state.byId={};state.byRuta={};
  state.fields.forEach(function(f){state.byId[f.id]=f;var r=refOf(f);state.byRuta[f.hoja+"|"+r]=f;if(!state.byRuta["*|"+r])state.byRuta["*|"+r]=f});
  state._autoPdf=null;state._autoAcro=null;
}
function isSiNo(f){
  if(f.widget0==="boolean") return true;
  if(f.widget0==="radio"&&!f.options.length) return true;
  var o=f.options.map(low).sort().join("|");
  return (f.widget0==="radio"||f.widget0==="select")&&o==="no|si";
}
function widgetOf(f){return state.ov.t[key(f)]||state.predet.t[f.leaf]||(isSiNo(f)&&state.predet.clases.sino)||f.widget0}
function typeSrc(f){if(state.ov.t[key(f)])return "Lo cambiaste vos en esta ficha";if(state.predet.t[f.leaf])return "Tu predeterminado para «"+f.leaf+"»";if(isSiNo(f)&&state.predet.clases.sino)return "Tu ajuste para todas las preguntas Sí/No";return "Según la ficha: «"+(f.tipo||"sin tipo")+"»"}
function widthOf(f){
  var o=state.ov.w[key(f)];
  if(o) return {w:o,src:"Lo cambiaste vos en esta ficha"};
  if(state.predet.w[f.leaf]) return {w:state.predet.w[f.leaf],src:"Tu predeterminado para «"+f.leaf+"»"};
  for(var i=0;i<CONV.length;i++) if(CONV[i].test(f)) return {w:CONV[i].w,src:"Convención: "+CONV[i].txt};
  return {w:"half",src:"Por defecto: 1/2"};
}
function condOf(f){
  var k=key(f);
  if(k in state.ov.c){var o=state.ov.c[k];return o?Object.assign({status:"conf"},o):null}
  var a=state.autoCond[f.ruta];return a?Object.assign({status:"prop"},a):null;
}
function valueOf(f){return state.vals[f.id]}
/* personas que se agregan (dependientes, beneficiarios) */
var INST_NAMES={dependientemenor:["DME","Dependiente menor"],dependientemayor:["DMA","Dependiente mayor"],beneficiario:["BNF","Beneficiario"],dependiente:["DME","Dependiente"]};
function isAdder(f){return /^indicadorAgregar/i.test(f.leaf)}
function adderInfo(f){var k=low(f.leaf.replace(/^indicadorAgregar/i,"")),x=INST_NAMES[k]||["OTR",f.leaf.replace(/^indicadorAgregar/i,"")];return {code:x[0],name:x[1]}}
function personTemplate(ctrl){
  var anchor=state.fields.filter(function(x){return x.hoja===ctrl.hoja&&/^codigoTipoIdentificacion$/.test(x.leaf)})[0];
  var sec=anchor?anchor.seccion:ctrl.seccion;
  return state.fields.filter(function(x){return x.hoja===ctrl.hoja&&x.seccion===sec&&!x.soloJSON&&!x.oculto&&!isAdder(x)});
}
function proxy(f,tag){var id=f.id+"__"+tag;var p=state.byId[id];if(!p){p=Object.create(f);p.id=id;p.inst=tag;p.base=f;state.byId[id]=p}return p}
function instCount(ctrl){var yes=low(valueOf(ctrl)||"")==="si";if(!yes)return 0;var n=state.inst[ctrl.id];return n==null?1:n}
function matches(ctrl,v){
  var cur=valueOf(ctrl);
  if(widgetOf(ctrl)==="checkbox") return v==="Marcado"?!!cur:!cur;
  return cur!=null&&cur!==""&&low(cur)===low(v);
}
function ruleVisible(f,depth){
  depth=depth||0;if(depth>12) return true;
  var c=condOf(f);if(!c||!c.conditions.length) return true;
  var res=c.conditions.map(function(x){var ctrl=state.byRuta[f.hoja+"|"+x.ruta]||state.byRuta["*|"+x.ruta];if(!ctrl)return true;if(f.inst&&state.byId[ctrl.id+"__"+f.inst])ctrl=state.byId[ctrl.id+"__"+f.inst];return ruleVisible(ctrl,depth+1)&&matches(ctrl,x.value)});
  return c.logic==="and"?res.every(Boolean):res.some(Boolean);
}
function governs(f){var r=refOf(f);return state.fields.filter(function(d){var dc=condOf(d);return dc&&dc.conditions.some(function(k){return k.ruta===r})})}

/* cualquier campo puede condicionar: los que tienen opciones primero, después el resto (incluidos ocultos y solo JSON) */
function ctrlOptionsHtml(sel,exclude){
  var a=state.fields.filter(function(x){return x!==exclude&&isCtrl(x)&&optsOf(x).length}),b=state.fields.filter(function(x){return x!==exclude&&a.indexOf(x)<0});
  function o(x){return '<option value="'+esc(refOf(x))+'"'+(refOf(x)===sel?" selected":"")+">"+esc(x.label.slice(0,60))+(staticHidden(x)?" (oculto)":"")+"</option>"}
  return '<optgroup label="Preguntas con opciones">'+a.map(o).join("")+'</optgroup><optgroup label="Otros campos (texto, ocultos, solo JSON)">'+b.map(o).join("")+"</optgroup>";
}
function valueCtlHtml(ctrl,val,attr){
  var op=ctrl&&isCtrl(ctrl)?optsOf(ctrl):[];
  if(op.length) return '<select '+attr+'>'+op.map(function(v){return "<option"+(low(v)===low(val||"")?" selected":"")+">"+esc(v)+"</option>"}).join("")+"</select>";
  return '<input '+attr+' value="'+esc(val||"")+'" placeholder="valor exacto, ej. ASG">';
}
function condText(c){
  if(!c) return "";
  var parts=c.conditions.map(function(x){var ctrl=state.byRuta["*|"+x.ruta];return "«"+esc(ctrl?ctrl.label:leafOf(x.ruta))+"» es <b>"+esc(x.value)+"</b>"});

/* ============ carga ============ */
function loadData(obj){
  var r=parseSheets(obj.sheets);
  state.ordering=false;state.file=obj.file;state.sheets=obj.sheets;state.selW=null;state._autoAcro=null;state.fields=r.fields;state.legends=r.legends;state.ejemplo=r.ejemplo;state.sel=null;state.vals={};state.inst={};state.lastVisible={};
  state.baseFields=r.fields;
  state.ov=normOv(store("fv2-ov:"+obj.file));state.main=null;rebuildFields();
  var pd=store("fv2-predet")||{};state.predet={w:pd.w||{},t:pd.t||{},clases:pd.clases||{}};
  var ac=buildAutoConds(r.fields);state.autoCond=ac.auto;state.secHide=ac.secHide;

  document.getElementById("btnSample").hidden=!!obj.sample;

  if(!r.fields.length) showErr("No encontré filas con ruta JSON (columna M). ¿Es una ficha del formato nuevo, con una hoja por nodo y 14 columnas?");
  render();

function outVal(f){
  var w=widgetOf(f),v=valueOf(f);
  if(v==null||v==="") return null;
  if(w==="boolean") return v==="Sí"?"true":"false";
  if(w==="checkbox") return "true";
  if(w==="number"||w==="numcombo") return isNaN(Number(v))?'"'+esc(v)+'"':String(Number(v));
  if(w==="date"){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v);return '"'+(m?m[3]+"/"+m[2]+"/"+m[1]:esc(v))+'"'}
  return '"'+esc(v)+'"';
}
function buildTree(){
  var root={},list=state.fields.filter(function(f){return f.ruta}).map(function(f){return {f:f,ruta:f.ruta}}),k=1;
  state.fields.filter(isAdder).forEach(function(ctrl){
    var n=instCount(ctrl),info=adderInfo(ctrl),tpl=personTemplate(ctrl),ct=state.fields.filter(function(x){return x.hoja===ctrl.hoja&&x.leaf==="codigoTipo"})[0];
    for(var i=1;i<=n;i++,k++){
      var tag=info.code+i,pre="personas["+k+"]";
      if(ct){var pc=proxy(ct,tag);state.vals[pc.id]=info.code;list.push({f:pc,ruta:ct.ruta.replace("personas[]",pre)})}
      tpl.forEach(function(f){list.push({f:proxy(f,tag),ruta:f.ruta.replace("personas[]",pre)})});
    }
  });
  list.forEach(function(e){
    var f=e.f,parts=e.ruta.replace(/\[(\d*)\]/g,function(m,d){return ".["+(d||"0")+"]"}).split(".").filter(Boolean),node=root;
    parts.forEach(function(p,i){
      if(i===parts.length-1){node[p]={__f:f}}
      else{if(!node[p]||node[p].__f)node[p]={};node=node[p]}
    });
  });
  return root;
}
function treeLines(node,ind,out,isLast,key){
  var pad="  ".repeat(ind),keys=Object.keys(node).filter(function(k){return k!=="__f"});
  var isArr=keys.length>0&&keys.every(function(k){return /^\[\d+\]$/.test(k)});
  out.push('<div class="jl"><span>'+pad+(key!=null?'<span class="jk">"'+esc(key)+'"</span>: ':"")+(isArr?"[":"{")+"</span></div>");
  var kids=isArr?keys.sort(function(a,b){return +a.slice(1,-1)-(+b.slice(1,-1))}).map(function(k){return ["",node[k]]}):keys.map(function(k){return [k,node[k]]});
  kids.forEach(function(kv,i){
    var k=kv[0],v=kv[1],last=i===kids.length-1,comma=last?"":",";
    if(v.__f){
      var f=v.__f,val=outVal(f),vis=!staticHidden(f)?ruleVisible(f):true,off=!vis;
      var cls="jl leaf"+(state.sel===f.id?" sel":"")+(val==null?" empty":"")+(off?" off":"");
      out.push('<div class="'+cls+'" data-f="'+f.id+'"><span>'+"  ".repeat(ind+1)+'<span class="jk">"'+esc(k)+'"</span>: <span class="jv">'+(val==null?"null":val)+"</span>"+comma+'</span><span class="jc">'+esc(f.label)+(f.soloJSON?" · lo manda el sistema":"")+(off?" · no se emite: la pregunta está escondida":"")+"</span></div>");
    }else if(k===""){treeLines(v,ind+1,out,last,null)}
    else treeLines(v,ind+1,out,last,k);
  });
  out.push('<div class="jl"><span>'+pad+(isArr?"]":"}")+(isLast?"":",")+"</span></div>");
}
function hasPath(obj,route){
  var parts=route.replace(/\[\]/g,"").split(".").filter(Boolean),n=obj;
  for(var i=0;i<parts.length;i++){if(Array.isArray(n))n=n[0];if(n==null||typeof n!=="object"||!(parts[i] in n))return false;n=n[parts[i]]}
  return true;
}

/* ============ main de Signframe: carga y cruce ============ */
function toks(s){return String(s||"").replace(/([a-z])([A-Z])/g,"$1 $2").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").split(/[^a-z0-9ñ]+/).filter(function(w){return w.length>=2&&!/^\d+$/.test(w)})}
var GENERIC={codigo:1,indicador:1,descripcion:1,de:1,la:1,el:1,del:1,los:1,las:1,en:1,su:1};
function stems(list){var o={};list.forEach(function(w){o[w.slice(0,5)]=1});return o}
function normSn(sn){return String(sn||"").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"")}
function parseMain(obj,file){
  var root=obj&&obj.generatedDefinition?obj.generatedDefinition:obj,out=[],seen={};
  function walkF(fl){(fl||[]).forEach(function(x){
    if(x&&x.sourceMeta&&x.sourceMeta.sourceName&&!seen[x.sourceMeta.sourceName]){seen[x.sourceMeta.sourceName]=1;
      out.push({sn:x.sourceMeta.sourceName,id:x.id,type:x.type,label:x.label,page:x.sourceMeta.page||1,raw:x})}
    if(x&&x.repeaterConfig){walkF(x.repeaterConfig.fields);if(x.repeaterConfig.child)walkF(x.repeaterConfig.child.fields)}
  })}
  function walkS(ss){(ss||[]).forEach(function(sec){walkF(sec.fields);walkS(sec.subsections)})}
  walkS(root&&root.sections);
  if(!out.length) throw new Error("No encontré campos con sourceMeta.sourceName. ¿Es el JSON que baja Signframe después de importar el PDF?");
  out.sort(function(a,b){var ra=a.raw.sourceMeta.rect||{},rb=b.raw.sourceMeta.rect||{};return (a.page-b.page)||((rb.Y||rb.y||0)-(ra.Y||ra.y||0))||((ra.X||ra.x||0)-(rb.X||rb.x||0))});
  return {file:file,fields:out,sourcePdf:root._sourcePdf||null};
}
function mainBySn(){var m={};(state.main?state.main.fields:[]).forEach(function(x){m[x.sn]=x});return m}
function autoPdf(){
  if(!state.main) return {};
  if(state._autoPdfFor===state.main&&state._autoPdfOv===state.fields) return state._autoPdf;
  var res={},used={},M=state.main.fields;
  var st=M.map(function(x){return {x:x,s:stems(toks(x.sn))}});
  function cands(base,extra){return st.filter(function(e){return base.every(function(w){return e.s[w.slice(0,5)]})&&(!extra||e.s[extra.slice(0,5)])})}
  state.fields.forEach(function(f){
    var r={sn:null,opts:{},status:null},an=acroNamesFor(f),inM=function(n){return M.some(function(x){return x.sn===n})};
    var col=f.sourceNames.concat(an.whole).filter(inM);
    Object.keys(an.opts).forEach(function(o){if(inM(an.opts[o])){r.opts[o]=an.opts[o];r.status="colN"}});
    if(col.length){r.sn=col[0];r.status="colN"}
    if(r.status){res[key(f)]=r;return}
    if(f.soloJSON) return;
    var base=toks(f.leaf).filter(function(w){return !GENERIC[w]});
    if(!base.length) return;
    var opts=isCtrl(f)&&widgetOf(f)!=="checkbox"?optsOf(f):[];
    if(opts.length&&!f.catalogo){
      opts.forEach(function(o){var ot=toks(o)[0];if(!ot)return;var c=cands(base,ot);if(c.length===1){r.opts[o]=c[0].x.sn;r.status="prop"}});
    }else{
      var c=cands(base).filter(function(e){return !opts.length});
      if(c.length===1){r.sn=c[0].x.sn;r.status="prop"}
    }
    if(r.status) res[key(f)]=r;
  });
  state._autoPdf=res;state._autoPdfFor=state.main;state._autoPdfOv=state.fields;
  return res;
}
function pdfMapOf(f){
  var o=state.ov.pdf[key(f)];
  if(o) return {sn:o.sn||null,opts:Object.assign({},o.opts||{}),status:"conf"};
  var a=autoPdf()[key(f)];
  return a?{sn:a.sn,opts:Object.assign({},a.opts),status:a.status}:{sn:null,opts:{},status:null};

function setPdf(f,fn){var m=pdfMapOf(f),b={sn:m.sn,opts:m.opts};fn(b);state.ov.pdf[key(f)]=b;saveOv();render()}

function bindPdfInputs(root){

    opts.forEach(function(o){r+='<tr class="opt"><td>↳ '+esc(slotLabel(o))+'</td><td><input class="map-in'+cls+'" list="snList" data-pm="'+f.id+'" data-po="'+esc(o)+'" value="'+esc(m.opts[o]||"")+'"></td><td></td></tr>'});

  var libres=M.filter(function(x){return !used[x.sn]});

    libres.map(function(x){return '<tr><td class="mono">'+esc(x.sn)+"</td><td>"+esc(x.type||"")+"</td><td>"+x.page+"</td></tr>"}).join("")+"</tbody></table></div>";

/* ============ AcroForms del PDF crudo ============ */
var PREF={personas:"asegurado",datosgenerales:"solicitud",polizamadre:"poliza",intermediario:"intermediario",direccion:"direccion",mediosnotificacion:"notificacion",encabezado:"sistema",datosadicionales:"adicional"};
function snake(x){return String(x||"").replace(/([a-z0-9])([A-Z])/g,"$1_$2").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"")}
function prefixFor(f){var h=low(f.hoja).replace(/\s+/g,"");return PREF[h]||(h==="riesgo"?snake(f.seccion):snake(f.hoja))}
function proposeName(f,opt){var leaf=f.leaf.replace(/^(codigo|indicador|descripcion)(?=[A-Z])/,"");return [prefixFor(f),snake(leaf)||snake(f.leaf),opt?snake(opt):""].filter(Boolean).join("_")}
function fieldByKey(k){if(!state._fk||state._fkFor!==state.fields){state._fk={};state.fields.forEach(function(f){state._fk[key(f)]=f});state._fkFor=state.fields}return state._fk[k]}
function nearText(r,texts){
  var x1=Math.min(r[0],r[2]),x2=Math.max(r[0],r[2]),y1=Math.min(r[1],r[3]),y2=Math.max(r[1],r[3]),mid=(y1+y2)/2,tol=Math.max(7,(y2-y1)*0.8);
  var line=texts.filter(function(t){return Math.abs(t.y+t.h/2-mid)<tol});

function canPlainDownload(){return !(window.claude&&window.claude.use)}
function xlsxSave(wb,name,btn,label){
  if(!window.XLSX){showErr("No se pudo cargar el generador de Excel. Recargá la página.");return}
  var data=XLSX.write(wb,{bookType:"xlsx",type:"array"});
  if(!DL){if(canPlainDownload()&&plainDownload(name,new Uint8Array(data),"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"))return;showErr("La descarga no está disponible en esta vista.");return}
  DL.save({filename:name,data:new Uint8Array(data)}).then(function(){btn.textContent="Descargado";setTimeout(function(){btn.textContent=label},2500)},function(e){if(e&&e.code!=="declined")showErr("No se pudo descargar: "+(e.message||e.code))});
}
function exportFichaN(btn){
  var N=finalNames(),map={};
  state.acro.widgets.forEach(function(w){var m=acroOf(w);if(!m||!N[w.key])return;var o=map[m.fk]=map[m.fk]||{whole:[],opts:{}};if(m.opt)o.opts[low(m.opt)]=N[w.key];else o.whole.push(N[w.key])});
  var sheets=state.sheets.map(function(sh){return {name:sh.name,rows:(sh.rows||[]).map(function(r){return (r||[]).slice()})}}),byName={};
  sheets.forEach(function(sh){byName[norm(sh.name)]=sh});
  state.fields.forEach(function(f){var o=map[key(f)];if(!o)return;var sh=byName[f.hoja];if(!sh)return;
    (f.filas||[]).forEach(function(fila,i){var row=sh.rows[fila-1];if(!row)return;while(row.length<14)row.push(null);
      var v=o.opts[low(f.reglaRows[i].valor)]||o.whole.join(", ")||Object.keys(o.opts).map(function(k){return o.opts[k]}).join(", ");row[13]=v||row[13]})});
  var wb=XLSX.utils.book_new();sheets.forEach(function(sh){XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sh.rows),sh.name.slice(0,31))});
  xlsxSave(wb,state.file.replace(/\.xlsx?$/i,"")+"_colN.xlsx",btn,"Descargar ficha con col N (.xlsx)");
}
function exportPack(btn){
  var N=finalNames(),rows=[["pagina","acroform_actual","tipo","texto_al_lado","pregunta_cercana","nombre_nuevo","hoja","filas","pregunta_ficha","opcion","ruta_json","estado"]];
  state.acro.widgets.forEach(function(w){var m=acroOf(w),f=m?fieldByKey(m.fk):null;
    rows.push([w.page,w.name,w.type,w.near,w.question,N[w.key]||"",f?f.hoja:"",f?(f.filas||[]).join(","):"",f?f.label:"",m?m.opt||"":"",f?f.ruta:"",!m?"sin asignar":m.status==="prop"?"propuesta":"asignado"])});
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),"paquete_campos");
  xlsxSave(wb,"paquete_campos_"+state.acro.file.replace(/\.pdf$/i,"")+".xlsx",btn,"Descargar paquete de campos (.xlsx)");
}

/* ============ exportar form-def de Signframe ============ */
function exportCtx(){return {M:mainBySn(),ids:{}}}
function dateFmt(f){var t=low(f.reglas.map(function(r){return r.regla}).join(" ")+" "+f.valores.join(" "));if(/aaaa-mm-dd/.test(t))return "YYYY-MM-DD";if(/dd\/mm\/aaaa/.test(t))return "DD/MM/YYYY";return null}
function memberId(f,o,ctx){var m=pdfMapOf(f),sn=m.opts[o];return sn&&ctx.M[sn]?ctx.M[sn].raw.id:sfId(f)+"_"+slug(o)}
function baseId(f,ctx){var m=pdfMapOf(f);return m.sn&&ctx.M[m.sn]?ctx.M[m.sn].raw.id:sfId(f)}
function condFor(f,ctx){
  var c=condOf(f);if(!c||!c.conditions.length)return null;
  var conds=c.conditions.map(function(x){var ctrl=state.byRuta["*|"+x.ruta];if(!ctrl)return null;var w=widgetOf(ctrl);
    if(w==="radio")return {fieldId:memberId(ctrl,x.value,ctx),operator:"equals",value:"true"};
    if(w==="boolean")return {fieldId:baseId(ctrl,ctx),operator:"equals",value:low(x.value)==="si"?"true":"false"};
    if(w==="checkbox")return {fieldId:baseId(ctrl,ctx),operator:"equals",value:"true"};
    return {fieldId:baseId(ctrl,ctx),operator:"equals",value:x.value};
  }).filter(Boolean);
  return conds.length?{str:JSON.stringify({logic:c.logic||"or",conditions:conds}),required:!!c.required}:null;
}
function sfFields(f,ctx){
  var w=widgetOf(f),m=pdfMapOf(f),out=[],cd=condFor(f,ctx),path=f.ruta?f.ruta.replace(/\[\]/g,"[0]"):null;
  function common(o){
    o.required=!!f.required&&!cd;o.readOnly=!!f.readOnly;o.width=widthOf(f).w;
    if(staticHidden(f))o.hidden=true;
    if(f.maxLength&&/text|textarea|number/.test(o.type))o.maxLength=f.maxLength;
    if(path&&(f.prellenado||f.soloJSON)){o.prefillKey=path;o.prefillMode="optional"}
    if(cd){o.conditionalVisibility=cd.str;if(cd.required)o.conditionalRequired=cd.str}
    return o;
  }
  function withPdf(o,sn){if(sn&&ctx.M[sn]){o.id=ctx.M[sn].raw.id;o.sourceMeta=ctx.M[sn].raw.sourceMeta}return o}
  var opts=optsOf(f);
  if(w==="radio"){
    var ids=opts.map(function(o){return memberId(f,o,ctx)});
    opts.forEach(function(o,i){
      var r=common({id:ids[i],type:"radio",label:o,radioGroupLabel:f.label,radioGroupFields:ids.filter(function(x,j){return j!==i}),jsonOutputPath:path||undefined,excludeFromJson:path?undefined:true,checkedJsonValue:o,optionsLayout:"horizontal"});
      if(i>0)r.required=false;
      out.push(withPdf(r,m.opts[o]));
    });
    return out;
  }
  var o={id:sfId(f),type:w==="numcombo"?"number":w,label:f.label};
  if(w==="select"){o.options=opts.map(function(x){return {label:x,pdfValue:x,jsonValue:x}});if(f.catalogo){o.options=[];o._pendiente="Catálogo INS: cargar la lista"}}
  if(w==="date"){var df=dateFmt(f);if(df)o.jsonDateFormat=df;o.pdfDateFormat="DD/MM/YYYY"}
  if(path)o.jsonOutputPath=path;else o.excludeFromJson=true;
  common(o);withPdf(o,m.sn);out.push(o);
  if(w==="numcombo"){out.push(common({id:sfId(f)+"_unidad",type:"select",label:"Unidad",options:(f.unidades||[]).map(function(x){return {label:x,pdfValue:x,jsonValue:x}}),excludeFromJson:true,_pendiente:"La ficha declara número y unidad en la misma ruta: definir cómo se arma el valor"}))}
  var an=acroNamesFor(f),parts={};
  Object.keys(m.opts).forEach(function(op){if(op.charAt(0)==="@"&&m.opts[op])parts[op]={sn:m.opts[op]}});
  Object.keys(an.opts).forEach(function(op){if(op.charAt(0)==="@"&&!parts[op])parts[op]={nuevo:an.opts[op]}});
  var srcId=w==="radio"?null:o.id;
  Object.keys(parts).forEach(function(op){
    if(!srcId)return;var pt=parts[op],hid=pt.sn&&ctx.M[pt.sn]?ctx.M[pt.sn].raw.id:(pt.nuevo?"field_"+normSn(pt.nuevo):sfId(f)+"_"+op.slice(1));
    var tok={kind:"field",fieldId:srcId};if(PART_CUT[op])tok.transforms=[{kind:"substring",start:PART_CUT[op][0],end:PART_CUT[op][1]}];
    var hlp={id:hid,type:"text",label:f.label+" · "+slotLabel(op),hidden:true,readOnly:true,excludeFromJson:true,width:"quarter",autoFillConcat:{sourceFieldIds:[srcId],separator:"",parts:[tok]}};
    if(pt.sn&&ctx.M[pt.sn])hlp.sourceMeta=ctx.M[pt.sn].raw.sourceMeta;else hlp._pendiente="Helper sin sourceMeta hasta cargar el main";
    out.push(hlp);
  });
  Object.keys(m.opts).forEach(function(op){var sn=m.opts[op];if(op.charAt(0)==="@"||!sn||!ctx.M[sn]||w==="radio")return;
    out.push({id:ctx.M[sn].raw.id,type:"checkbox",label:f.label+" · "+op,hidden:true,excludeFromJson:true,sourceMeta:ctx.M[sn].raw.sourceMeta,
      autoFillConcat:{sourceFieldIds:[o.id],separator:"",parts:[{kind:"text",value:"X",condition:{fieldId:o.id,op:"equals",values:op}}]}})});
  return out;
}
function buildFormDef(){
  var ctx=exportCtx(),G=groups(),pend=[],usedIds={};
  var sections=G.map(function(p,pi){
    return {id:"section_"+(pi+1),title:p.name,order:pi+1,fields:[],subsections:p.secs.map(function(x,si){
      var fl=[];x.items.forEach(function(it){if(it.kind!=="f")return;sfFields(it.f,ctx).forEach(function(o){usedIds[o.id]=1;if(o._pendiente)pend.push(o.label+": "+o._pendiente);fl.push(o)})});
      var sub={id:"sub_"+(pi+1)+"_"+(si+1),title:x.name,order:si+1,fields:fl};
      if(x.key===SIS||state.secHide[x.key])sub.hidden=true;
      return sub;
    }).filter(function(sb){return sb.fields.length})};
  });
  if(state.main){
    var libres=state.main.fields.filter(function(x){return !usedIds[x.raw.id]}).map(function(x){var r=JSON.parse(JSON.stringify(x.raw));r.hidden=true;return r});
    if(libres.length&&sections.length)sections[0].subsections.push({id:"sub_pdf_sin_usar",title:"Campos del PDF sin usar",order:99,hidden:true,fields:libres});
  }
  state.fields.filter(isAdder).forEach(function(c){pend.push("«"+c.label+"»: las personas agregables van como subsecciones fijas con botones agregar/quitar y codigoTipo "+adderInfo(c).code+" por autoFillConcat (nunca repeater sobre personas[])")});
  var props=state.fields.filter(function(f){var c=condOf(f);return c&&c.status==="prop"}).length;
  if(props)pend.push(props+" condiciones siguen como propuesta (no confirmadas)");
  var def={version:(state.file.replace(/\.xlsx?$/i,"")||"form")+"_v1",sections:sections};
  if(state.main&&state.main.sourcePdf)def._sourcePdf=state.main.sourcePdf;
  def._generadoPor={herramienta:"Visor de Fichas INS",ficha:state.file,main:state.main?state.main.file:null,fecha:new Date().toISOString(),pendientes:pend,
    nota:state.main?"Los campos con casillero usan el id y el sourceMeta del main, sin tocar.":"Sin main cargado: ids provisorios field_ficha_* y sin sourceMeta. Cargá el main para fundirlos."};
  return def;
}
function exportFormDef(btn){
  var def=buildFormDef(),txt=JSON.stringify(def,null,2),name="form-definition-"+def.version.replace(/[^\w.-]+/g,"_")+".json";
  function fallback(){state.tab="tabla";render();var el=document.getElementById("insp");el.insertAdjacentHTML("afterbegin",'<div class="blk"><div class="t">form-def</div><div class="note">No se pudo descargar desde acá: copialo.</div><textarea class="out" id="fdOut" readonly></textarea></div>');var t=document.getElementById("fdOut");t.value=txt;t.focus();t.select()}
  if(DL){DL.save({filename:name,data:txt}).then(function(){btn.textContent="Descargado";setTimeout(function(){btn.textContent="Exportar form-def"},2500)},function(e){if(e&&e.code!=="declined")fallback()})}
  else if(canPlainDownload()&&plainDownload(name,txt,"application/json")){}
  else fallback();
}

/* ============ render general ============ */
function renderStats(){
  var F=state.fields,c=function(fn){return F.filter(fn).length};
  var reg=F.reduce(function(a,f){return a+f.reglas.length},0);
  var nc=c(function(f){return !!condOf(f)});
  var visNow=c(function(f){return !staticHidden(f)&&ruleVisible(f)});
  var items=[[F.length,"campos"],[visNow,"visibles ahora"],[c(function(f){return f.soloJSON}),"solo JSON"],[c(function(f){return staticHidden(f)&&!f.soloJSON}),"ocultos"],[nc,"con condición"],[c(function(f){var x=condOf(f);return x&&x.status==="prop"}),"condiciones por confirmar"]];
  document.getElementById("stats").innerHTML=items.map(function(x){return '<div class="stat"><b>'+x[0]+"</b><span>"+x[1]+"</span></div>"}).join("");
  document.getElementById("t-reglas").innerHTML='Reglas<span class="n">'+reg+"</span>";
}
function pick(fid){
  state.sel=fid;
  document.querySelectorAll("#view .sel").forEach(function(n){n.classList.remove("sel")});
  document.querySelectorAll('#view [data-f="'+fid+'"]').forEach(function(n){n.classList.add("sel")});
  renderInsp();
}
function render(){
  var y=window.scrollY;
  renderStats();
  document.querySelectorAll(".tab").forEach(function(t){t.setAttribute("aria-selected",String(t.getAttribute("data-tab")===state.tab))});
  var v=document.getElementById("view");
  if(!state.baseFields||!state.baseFields.length){v.innerHTML='<div class="info" style="max-width:640px"><b>Cargá una ficha del INS</b> con «Cargar ficha (.xlsx)» o soltándola en la página. Se leen todas las hojas del formato nuevo (una por nodo, 14 columnas) y armás el formulario, las reglas, el cruce con el PDF y el form-def desde acá.</div>';renderInsp();return}
  v.innerHTML=state.tab==="form"?renderForm():state.tab==="json"?renderJson():state.tab==="reglas"?renderReglas():state.tab==="pdf"?renderPdf():state.tab==="acro"?renderAcro():renderTabla();
  if(state.tab==="pdf") bindPdf(v);
  if(state.tab==="acro") bindAcro(v);
  if(state.tab==="form"&&state.ordering){bindOrden(v)}
  else if(state.tab==="form"){
    var bo=document.getElementById("btnOrden");if(bo)bo.onclick=function(){state.ordering=true;render()};
    bindMulti(v);
    v.querySelectorAll("[data-addf]").forEach(function(b){b.onclick=function(){
      var sk=b.getAttribute("data-addf"),cid=Date.now().toString(36),c={cid:cid,label:"Campo nuevo",type:"text",ruta:"",options:[],required:false};
      state.ov.cf.push(c);state.ov.fsec["manual|"+cid]=sk;rebuildFields();state.sel="cf_"+cid;saveOv();render();
      var inp=document.getElementById("cfLabel");if(inp){inp.focus();inp.select()}}});
    v.querySelectorAll("[data-pick]").forEach(function(n){n.onclick=function(){pick(n.getAttribute("data-pick"))};n.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();n.click()}}});
    v.querySelectorAll(".f").forEach(function(box){
      var f=state.byId[box.getAttribute("data-f")],w=widgetOf(f);
      box.addEventListener("focusin",function(){if(state.sel!==f.id)pick(f.id)});
      if(w==="radio") box.querySelectorAll("input[type=radio]").forEach(function(r){r.onchange=function(){state.vals[f.id]=r.getAttribute("data-v");render()}});
      else if(w==="boolean") box.querySelectorAll(".yn button").forEach(function(b){b.onclick=function(){var nv=b.getAttribute("data-v");state.vals[f.id]=state.vals[f.id]===nv?"":nv;render()}});
      else if(w==="checkbox"){var cb=box.querySelector("input[type=checkbox]");cb.onchange=function(){state.vals[f.id]=cb.checked?"true":"";render()}}
      else if(w==="select"){var s=box.querySelector("select");s.onchange=function(){state.vals[f.id]=s.value;render()}}
      else{
        var i=box.querySelector(".in");if(i)i.oninput=function(){state.vals[f.id]=i.value};
        var u=box.querySelector('select[id$="_u"]');if(u)u.onchange=function(){state.vals[f.id+"_u"]=u.value};
      }
    });
    v.querySelectorAll("[data-sino]").forEach(function(b){b.onclick=function(){var x=b.getAttribute("data-sino");if(x)state.predet.clases.sino=x;else delete state.predet.clases.sino;savePredet();render()}});
    v.querySelectorAll("[data-ia]").forEach(function(b){b.onclick=function(){var id=b.getAttribute("data-ia");state.inst[id]=instCount(state.byId[id])+1;render()}});
    v.querySelectorAll("[data-ir]").forEach(function(b){b.onclick=function(){var id=b.getAttribute("data-ir"),n=instCount(state.byId[id])-1;state.inst[id]=n;if(n<=0){state.vals[id]="No";state.inst[id]=1}render()}});
    var ca=document.getElementById("chkAll");if(ca)ca.onchange=function(){state.showAll=ca.checked;render()};
    var bc=document.getElementById("btnClear");if(bc)bc.onclick=function(){state.vals={};state.fields.forEach(function(f){if(f.prellenado&&f.ejemploValor&&!/getdate|ver cat/i.test(f.ejemploValor))state.vals[f.id]=f.ejemploValor});render()};
  }else{
    v.querySelectorAll("[data-f]").forEach(function(n){n.onclick=function(e){if(e.target.closest("input,select,button"))return;pick(n.getAttribute("data-f"))}});
  }
  v.querySelectorAll("[data-jm]").forEach(function(b){b.onclick=function(){state.jsonMode=b.getAttribute("data-jm");render()}});
  var q=document.getElementById("q");
  if(q){q.oninput=function(){state.q=q.value;var pos=q.selectionStart;render();var q2=document.getElementById("q");if(q2){q2.focus();try{q2.setSelectionRange(pos,pos)}catch(e){}}}}
  renderInsp();
  window.scrollTo(0,y);
  try{localStorage.setItem("fv2-tab",state.tab)}catch(e){}
}

document.querySelectorAll(".tab").forEach(function(t){t.onclick=function(){state.tab=t.getAttribute("data-tab");render()}});
document.getElementById("fileIn").onchange=function(e){if(e.target.files[0])readFile(e.target.files[0]);e.target.value=""};
var drop=document.getElementById("drop");
["dragenter","dragover"].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();drop.classList.add("over")})});
["dragleave","drop"].forEach(function(ev){document.addEventListener(ev,function(e){e.preventDefault();if(ev==="drop"||e.target===document.documentElement)drop.classList.remove("over")})});
document.addEventListener("drop",function(e){var f=e.dataTransfer&&e.dataTransfer.files[0];if(f)readFile(f)});
var SAMPLE=null;try{SAMPLE=JSON.parse(document.getElementById("sample").textContent);if(SAMPLE)SAMPLE.sample=true}catch(e){SAMPLE=null}
document.getElementById("btnSample").onclick=function(){if(SAMPLE)loadData(SAMPLE)};
document.getElementById("btnFormDef").onclick=function(){exportFormDef(this)};
try{var t=localStorage.getItem("fv2-tab");if(t)state.tab=t}catch(e){}
if(SAMPLE)loadData(SAMPLE);else{state.fields=[];state.baseFields=[];state.legends=[];state.ov=normOv(null);state.predet={w:{},t:{},clases:{}};
  var ps=store("fv2-predet");if(ps)state.predet={w:ps.w||{},t:ps.t||{},clases:ps.clases||{}};
  document.getElementById("btnSample").hidden=true;document.getElementById("fileName").textContent="Sin ficha cargada";render()}
try{
  var u=window.claude&&window.claude.use?window.claude.use("db"):null;
  if(u&&u.then)u.then(function(db){if(db){DB=db;loadRemote()}},function(){});
  var dl=window.claude&&window.claude.use?window.claude.use("downloads"):null;
  if(dl&&dl.then)dl.then(function(d){DL=d},function(){});
}catch(e){}
})();
